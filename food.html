<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AI3 南港美食 3D 午餐選擇器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ========== 1. Reset & 全螢幕 Canvas ========== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:#f3f4f8;
  background:radial-gradient(1200px 800px at 70% 40%,#2b2a5a 0%,#15152e 55%,#0b0b18 100%);
}
#canvas-container{position:fixed;inset:0;z-index:0;touch-action:none}
#canvas-container canvas{display:block;cursor:grab}
#canvas-container canvas:active{cursor:grabbing}

/* ========== 2. 玻璃擬態 UI ========== */
.glass{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}
#header{
  position:fixed;top:0;left:0;right:0;z-index:5;height:64px;
  display:flex;align-items:center;gap:14px;padding:0 24px;
  border-radius:0;border-width:0 0 1px 0;
}
#header .logo{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#ff7a59,#ffc15e);color:#1a1a2e;font-weight:800;font-size:14px;
}
#header h1{font-size:18px;font-weight:700;letter-spacing:.5px}
#header .sub{font-size:12px;opacity:.65;margin-top:2px}

#ui-container{
  position:fixed;z-index:4;top:80px;left:20px;bottom:20px;width:320px;
  border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;
}
.section-title{font-size:13px;font-weight:700;opacity:.8;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title i{color:#ffc15e;width:16px;text-align:center}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg input{display:none}
.seg label{
  text-align:center;padding:9px 4px;border-radius:10px;font-size:13px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:.15s;
}
.seg input:checked+label{background:linear-gradient(135deg,#ff7a59,#ff9f5a);border-color:transparent;color:#fff;font-weight:700}
.hint{font-size:11.5px;opacity:.55;margin-top:6px;line-height:1.5}

.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:.15s;user-select:none;
}
.chk input{appearance:none;width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;flex:none}
.chk input:checked{background:#ffc15e;border-color:#ffc15e}
.chk input:checked::after{content:"✓";color:#1a1a2e;font-size:11px;font-weight:900}
.chk:has(input:checked){border-color:rgba(255,193,94,.55);background:rgba(255,193,94,.12)}
.chk.wide{grid-column:1/-1}
.mini-actions{display:flex;gap:8px;margin-top:8px}
.mini-actions button{flex:1;font-size:12px;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:transparent;color:inherit;cursor:pointer;opacity:.8}
.mini-actions button:hover{opacity:1;background:rgba(255,255,255,.06)}

#count-box{
  display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;
  background:rgba(0,0,0,.22);font-size:13px;
}
#count-num{font-size:24px;font-weight:800;color:#ffc15e;margin:0 4px}
#count-box.zero #count-num{color:#ff6b6b}
#match-list{font-size:12.5px}
#match-list summary{cursor:pointer;opacity:.7;padding:4px 0}
#match-list ul{list-style:none;margin-top:6px;max-height:160px;overflow:auto;padding-right:4px}
#match-list li{padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.1);display:flex;justify-content:space-between;gap:8px}
#match-list li span:last-child{opacity:.55;white-space:nowrap}

#spin-btn{
  margin-top:auto;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:800;letter-spacing:1px;
  color:#1a1a2e;cursor:pointer;background:linear-gradient(135deg,#ffc15e,#ff7a59);
  box-shadow:0 8px 24px rgba(255,122,89,.4);transition:transform .12s,filter .12s,opacity .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
#spin-btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
#spin-btn:active:not(:disabled){transform:translateY(1px)}
#spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:grayscale(.6)}
#zero-hint{display:none;font-size:12px;color:#ff9b9b;text-align:center;margin-top:-8px}
#zero-hint.show{display:block}
.footnote{font-size:10.5px;opacity:.4;line-height:1.5;text-align:center}
body.spinning #ui-container .filters{pointer-events:none;opacity:.55}

/* ========== 3. 結果彈窗 ========== */
#result-modal{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  background:rgba(5,5,15,.45);transition:opacity .25s;
}
#result-modal.hidden{opacity:0;pointer-events:none}
#result-modal .card{
  width:min(420px,calc(100vw - 32px));border-radius:24px;padding:28px 24px 22px;text-align:center;
  transform:translateY(0) scale(1);transition:transform .35s cubic-bezier(.2,1.4,.4,1);
  background:rgba(30,30,60,.72);
}
#result-modal.hidden .card{transform:translateY(30px) scale(.92)}
.card .badge{display:inline-block;font-size:12px;padding:4px 12px;border-radius:99px;background:rgba(255,193,94,.18);color:#ffc15e;font-weight:700}
.card h2{font-size:26px;margin:14px 0 8px;line-height:1.3}
.card .dist{font-size:14px;opacity:.85}
.card .dist i{color:#ffc15e;margin-right:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0 20px}
.tag{font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
.tag.ac{background:rgba(94,200,255,.16);border-color:rgba(94,200,255,.35);color:#9fdcff}
.tag.noac{background:rgba(255,160,90,.14);border-color:rgba(255,160,90,.35);color:#ffc69a}
.actions{display:flex;flex-direction:column;gap:8px}
.actions a,.actions button{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;font-size:15px;font-weight:700;
  text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.16);color:#fff;background:rgba(255,255,255,.07);
}
.actions .primary{background:linear-gradient(135deg,#34c38f,#1fa67a);border:none}
.actions .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions a:hover,.actions button:hover{filter:brightness(1.12)}

#nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;z-index:20;background:#11112a}

/* ========== RWD：手機版改為底部面板 ========== */
@media (max-width:860px){
  #header{height:56px;padding:0 14px}
  #header h1{font-size:15px}
  #header .sub{font-size:11px}
  #ui-container{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:46vh;padding:14px;gap:12px;border-radius:18px}
  #spin-btn{position:sticky;bottom:0;padding:14px}
}
</style>
</head>
<body>

<!-- 3D 畫布容器 -->
<div id="canvas-container"></div>

<!-- Header -->
<header id="header" class="glass">
  <div class="logo">AI3</div>
  <div>
    <h1>AI3 南港午餐 3D 決策器</h1>
    <div class="sub">以 AI3（南港軟體園區・三重路）為中心｜半徑 2 公里</div>
  </div>
</header>

<!-- 前端篩選 UI 層 -->
<aside id="ui-container" class="glass">
  <div class="filters">
    <div style="margin-bottom:18px">
      <div class="section-title"><i class="fa-solid fa-person-walking"></i>距離範圍</div>
      <div class="seg">
        <input type="radio" name="dist" id="d500" value="500"><label for="d500">500m</label>
        <input type="radio" name="dist" id="d1000" value="1000"><label for="d1000">1km</label>
        <input type="radio" name="dist" id="d2000" value="2000" checked><label for="d2000">2km</label>
      </div>
      <div class="hint" id="dist-hint"></div>
    </div>

    <div style="margin-bottom:18px">
      <div class="section-title"><i class="fa-solid fa-snowflake"></i>環境條件</div>
      <label class="chk wide"><input type="checkbox" id="need-ac" checked>必須有冷氣</label>
    </div>

    <div>
      <div class="section-title"><i class="fa-solid fa-bowl-food"></i>食物種類（可複選）</div>
      <div class="chk-grid" id="cat-grid"></div>
      <div class="mini-actions">
        <button type="button" id="cat-all">全選</button>
        <button type="button" id="cat-none">全不選</button>
      </div>
    </div>
  </div>

  <div id="count-box">
    <span>符合條件</span>
    <span><b id="count-num">0</b>家</span>
  </div>

  <details id="match-list">
    <summary>查看符合的餐廳清單</summary>
    <ul id="match-ul"></ul>
  </details>

  <button id="spin-btn"><i class="fa-solid fa-dice"></i>決定吃什麼！</button>
  <div id="zero-hint">沒有符合條件的餐廳，請放寬篩選條件</div>
  <div class="footnote">距離為由 AI3 出發的步行距離估算值，可在程式碼 RESTAURANTS 陣列中調整</div>
</aside>

<!-- 結果彈窗層 -->
<div id="result-modal" class="hidden" aria-hidden="true">
  <div class="card glass" role="dialog" aria-modal="true">
    <span class="badge"><i class="fa-solid fa-star"></i> 今天就吃這家！</span>
    <h2 id="r-name">—</h2>
    <div class="dist"><i class="fa-solid fa-location-dot"></i><span id="r-dist">—</span></div>
    <div class="tags" id="r-tags"></div>
    <div class="actions">
      <a id="r-map" class="primary" href="#" target="_blank" rel="noopener"><i class="fa-solid fa-map-location-dot"></i>開啟 Google 地圖導航</a>
      <div class="row">
        <button id="r-again"><i class="fa-solid fa-rotate-right"></i>不滿意，再抽一次</button>
        <button id="r-filter"><i class="fa-solid fa-sliders"></i>重新篩選</button>
      </div>
    </div>
  </div>
</div>

<div id="nogl">
  <div>
    <h2 style="margin-bottom:10px">無法載入 3D 引擎</h2>
    <p style="opacity:.7">請確認瀏覽器已啟用 WebGL，且網路可連線至 cdnjs.cloudflare.com 以載入 Three.js。</p>
  </div>
</div>

<script>
/* =========================================================
 * 1. 餐廳資料庫（AI3 方圓 2km 內清單）
 *    distanceMeters：由 AI3（三重路・南港軟體園區）出發之步行距離估算
 *    categories 可用值：飯、麵、鍋貼/水餃、漢堡/美式、小吃/其他、健康餐/沙拉
 * ========================================================= */
const ORIGIN = "南港軟體園區 台北市南港區三重路19號";
const RESTAURANTS = [
  // ---- ≤ 500m：軟體園區內 / 步行 5 分 ----
  { id:"rest_001", name:"樂法 Le Phu",              distanceMeters:300,  hasAC:true,  categories:["漢堡/美式","健康餐/沙拉"], priceRange:"$" },
  { id:"rest_003", name:"南港軟體園區美食街",         distanceMeters:200,  hasAC:true,  categories:["飯","麵","小吃/其他"],     priceRange:"$" },
  { id:"rest_004", name:"八方雲集（園區周邊）",       distanceMeters:400,  hasAC:false, categories:["鍋貼/水餃","麵"],          priceRange:"$" },
  { id:"rest_005", name:"四海遊龍（園區周邊）",       distanceMeters:450,  hasAC:false, categories:["鍋貼/水餃"],               priceRange:"$" },
  { id:"rest_006", name:"麥當勞（南港經貿店）",       distanceMeters:450,  hasAC:true,  categories:["漢堡/美式"],               priceRange:"$" },
  { id:"rest_007", name:"摩斯漢堡（園區周邊）",       distanceMeters:400,  hasAC:true,  categories:["漢堡/美式","飯"],          priceRange:"$" },
  { id:"rest_008", name:"園區自助餐便當",             distanceMeters:350,  hasAC:false, categories:["飯"],                      priceRange:"$" },
  { id:"rest_009", name:"園區健康餐盒",               distanceMeters:350,  hasAC:true,  categories:["健康餐/沙拉","飯"],        priceRange:"$$" },

  // ---- ≤ 1000m：南港展覽館站 / 捷運站周邊 ----
  { id:"rest_010", name:"南港展覽館美食街",           distanceMeters:750,  hasAC:true,  categories:["飯","麵","小吃/其他"],     priceRange:"$$" },
  { id:"rest_011", name:"鬍鬚張魯肉飯（南港周邊）",   distanceMeters:900,  hasAC:true,  categories:["飯","小吃/其他"],          priceRange:"$" },
  { id:"rest_012", name:"吉野家（南港周邊）",         distanceMeters:950,  hasAC:true,  categories:["飯"],                      priceRange:"$" },
  { id:"rest_013", name:"三商巧福（南港周邊）",       distanceMeters:950,  hasAC:true,  categories:["麵","飯"],                 priceRange:"$" },
  { id:"rest_014", name:"Subway（南港周邊）",         distanceMeters:900,  hasAC:true,  categories:["健康餐/沙拉","漢堡/美式"], priceRange:"$" },
  { id:"rest_015", name:"巷弄牛肉麵（展覽館站周邊）", distanceMeters:850,  hasAC:false, categories:["麵"],                      priceRange:"$" },

  // ---- ≤ 2000m：南港車站 / 汐止交界 ----
  { id:"rest_002", name:"朱記餡餅粥店（南港環球店）", distanceMeters:1200, hasAC:true,  categories:["麵","飯","鍋貼/水餃"],     priceRange:"$$" },
  { id:"rest_016", name:"杏子豬排（環球南港店）",     distanceMeters:1300, hasAC:true,  categories:["飯"],                      priceRange:"$$" },
  { id:"rest_017", name:"大戶屋（南港車站周邊）",     distanceMeters:1400, hasAC:true,  categories:["飯","健康餐/沙拉"],        priceRange:"$$" },
  { id:"rest_018", name:"爭鮮迴轉壽司（南港車站）",   distanceMeters:1400, hasAC:true,  categories:["小吃/其他","飯"],          priceRange:"$$" },
  { id:"rest_019", name:"日式拉麵（南港車站周邊）",   distanceMeters:1450, hasAC:true,  categories:["麵"],                      priceRange:"$$" },
  { id:"rest_020", name:"南港老街小吃",               distanceMeters:1600, hasAC:false, categories:["小吃/其他","麵"],          priceRange:"$" },
  { id:"rest_021", name:"湯包小館（南港路周邊）",     distanceMeters:1500, hasAC:true,  categories:["小吃/其他","鍋貼/水餃"],   priceRange:"$$" },
  { id:"rest_022", name:"汐止交界自助餐",             distanceMeters:1900, hasAC:false, categories:["飯"],                      priceRange:"$" },
];

const CATEGORIES = [
  { key:"飯",          icon:"fa-bowl-rice" },
  { key:"麵",          icon:"fa-bowl-food" },
  { key:"鍋貼/水餃",   icon:"fa-cookie" },
  { key:"漢堡/美式",   icon:"fa-burger" },
  { key:"小吃/其他",   icon:"fa-utensils" },
  { key:"健康餐/沙拉", icon:"fa-leaf" },
];
const DIST_HINT = {
  500:"軟體園區內／步行約 5 分鐘",
  1000:"南港展覽館站・捷運站周邊",
  2000:"南港車站・汐止交界一帶",
};
function zoneOf(d){ return d<=500?"軟體園區內":d<=1000?"捷運站周邊":"南港車站／汐止交界"; }
function mapUrl(r){
  return "https://www.google.com/maps/dir/?api=1&travelmode=walking"
    + "&origin=" + encodeURIComponent(ORIGIN)
    + "&destination=" + encodeURIComponent(r.name.replace(/[（）()]/g," ") + " 台北市南港區");
}

/* ---------- 偏好記憶（LocalStorage，可失敗） ---------- */
const STORE_KEY = "ai3-lunch-filters";
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || null; }catch(e){ return null; } }
function savePrefs(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* =========================================================
 * 2. Three.js 場景、相機、渲染器、燈光初始化
 * ========================================================= */
if (typeof THREE === "undefined" || !(function(){try{const c=document.createElement("canvas");return !!(c.getContext("webgl")||c.getContext("experimental-webgl"));}catch(e){return false;}})()){
  document.getElementById("nogl").style.display = "grid";
  throw new Error("Three.js / WebGL unavailable");
}

const container = document.getElementById("canvas-container");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
dirLight.position.set(4, 6, 10);
scene.add(dirLight);
const rimLight = new THREE.PointLight(0xff7a59, 0.9, 30);
rimLight.position.set(-6, -3, 6);
scene.add(rimLight);
const rimLight2 = new THREE.PointLight(0x6a7bff, 0.8, 30);
rimLight2.position.set(6, 4, 4);
scene.add(rimLight2);

/* 背景漂浮星點 */
(function addStars(){
  const g = new THREE.BufferGeometry(), N = 400, pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*40; pos[i*3+1]=(Math.random()-.5)*24; pos[i*3+2]=-8-Math.random()*10; }
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.06, transparent:true, opacity:.55 }));
  stars.name = "stars"; scene.add(stars);
})();

/* =========================================================
 * 3. 3D 輪盤生成（Canvas 動態繪製文字貼圖）
 * ========================================================= */
const R = 3;                        // 輪盤半徑
const wheelRoot = new THREE.Group(); // 位置 / 視差傾斜
const spinner = new THREE.Group();   // 繞 Z 軸旋轉
wheelRoot.add(spinner);
scene.add(wheelRoot);

// 輪盤本體（厚度圓柱）
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(R, R, 0.5, 128),
  new THREE.MeshStandardMaterial({ color:0x23233f, metalness:.6, roughness:.35 })
);
body.rotation.x = Math.PI/2;
spinner.add(body);

// 正面貼圖
const faceCanvas = document.createElement("canvas");
faceCanvas.width = faceCanvas.height = 2048;
const faceTex = new THREE.CanvasTexture(faceCanvas);
faceTex.encoding = THREE.sRGBEncoding;
faceTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const face = new THREE.Mesh(
  new THREE.CircleGeometry(R*0.97, 128),
  new THREE.MeshStandardMaterial({ map:faceTex, roughness:.55, metalness:.05 })
);
face.position.z = 0.26;
spinner.add(face);

// 金色外環
const gold = new THREE.MeshStandardMaterial({ color:0xffc15e, metalness:.85, roughness:.25 });
const rim = new THREE.Mesh(new THREE.TorusGeometry(R, 0.13, 20, 160), gold);
rim.position.z = 0.2;
spinner.add(rim);

// 中心輪軸 + AI3 標誌
const hubCanvas = document.createElement("canvas");
hubCanvas.width = hubCanvas.height = 256;
(function drawHub(){
  const c = hubCanvas.getContext("2d");
  const g = c.createLinearGradient(0,0,256,256); g.addColorStop(0,"#ffc15e"); g.addColorStop(1,"#ff7a59");
  c.fillStyle = g; c.fillRect(0,0,256,256);
  c.fillStyle = "#1a1a2e"; c.font = "900 92px -apple-system,Segoe UI,sans-serif";
  c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("AI3",128,136);
})();
const hubTex = new THREE.CanvasTexture(hubCanvas); hubTex.encoding = THREE.sRGBEncoding;
const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.55, 0.62, 0.3, 64),
  [ gold, new THREE.MeshStandardMaterial({ map:hubTex, roughness:.4 }), gold ]
);
hub.rotation.x = Math.PI/2;
hub.position.z = 0.4;
spinner.add(hub);

// 分隔釘（隨資料重建）
const pegGroup = new THREE.Group();
spinner.add(pegGroup);
const pegGeo = new THREE.SphereGeometry(0.075, 16, 16);

// 指針（固定在上方，不隨輪盤轉）
const pointerPivot = new THREE.Group();
pointerPivot.position.set(0, R + 0.55, 0.55);
const pointer = new THREE.Mesh(
  new THREE.ConeGeometry(0.3, 0.8, 32),
  new THREE.MeshStandardMaterial({ color:0xff4d6d, metalness:.3, roughness:.3, emissive:0x400010 })
);
pointer.rotation.z = Math.PI;          // 尖端朝下
pointer.position.y = -0.1;
pointerPivot.add(pointer);
const pointerCap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 24), gold);
pointerCap.position.y = 0.3;
pointerPivot.add(pointerCap);
wheelRoot.add(pointerPivot);

const PALETTE = ["#ff7a59","#ffc15e","#5ec8ff","#9b7bff","#34c38f","#ff5c8a","#4dd4c6","#ffa94d"];
let wheelItems = [];
let segAngle = Math.PI * 2;

function sectorColors(n){
  const cols = [];
  for(let i=0;i<n;i++) cols.push(PALETTE[i % PALETTE.length]);
  if(n > 1 && cols[n-1] === cols[0]) cols[n-1] = PALETTE[(n % PALETTE.length + 2) % PALETTE.length];
  if(n > 2 && cols[n-1] === cols[n-2]) cols[n-1] = PALETTE[(PALETTE.indexOf(cols[n-2]) + 3) % PALETTE.length];
  return cols;
}

function buildWheel(list){
  wheelItems = list.slice();
  const n = Math.max(list.length, 1);
  segAngle = Math.PI * 2 / n;
  const ctx = faceCanvas.getContext("2d");
  const S = faceCanvas.width, C = S/2, RR = S/2 - 4;
  ctx.clearRect(0,0,S,S);

  if(list.length === 0){
    ctx.fillStyle = "#2a2a48"; ctx.beginPath(); ctx.arc(C,C,RR,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "700 110px PingFang TC,Microsoft JhengHei,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("沒有符合的餐廳", C, C - 420);
  } else {
    const cols = sectorColors(list.length);
    list.forEach((r, i) => {
      // 世界座標角度 θ（逆時針、y 向上）；canvas y 向下，所以取負號
      const t0 = i * segAngle, t1 = (i+1) * segAngle;
      const grad = ctx.createRadialGradient(C,C,RR*0.15,C,C,RR);
      grad.addColorStop(0, shade(cols[i], -25)); grad.addColorStop(1, cols[i]);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.moveTo(C,C);
      ctx.arc(C, C, RR, -t1, -t0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 6; ctx.stroke();

      // 文字（沿半徑方向）
      const tc = (t0 + t1) / 2;
      ctx.save();
      ctx.translate(C, C);
      ctx.rotate(-tc);
      const inner = RR * 0.24, outer = RR * 0.93, maxW = outer - inner;
      const midR = (inner + outer) / 2;
      const chord = list.length === 1 ? 999 : 2 * midR * Math.sin(segAngle/2);
      let fs = Math.min(112, chord * 0.62);
      let label = r.name;
      ctx.font = `800 ${fs}px PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif`;
      while(ctx.measureText(label).width > maxW && fs > 44){ fs -= 3; ctx.font = `800 ${fs}px PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif`; }
      while(ctx.measureText(label).width > maxW && label.length > 2){ label = label.slice(0, -2) + "…"; }
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillText(label, outer + 4, 5);
      ctx.fillStyle = "#ffffff"; ctx.fillText(label, outer, 0);
      ctx.restore();
    });
  }
  // 內圈陰影
  ctx.beginPath(); ctx.arc(C,C,RR*0.2,0,Math.PI*2); ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fill();
  faceTex.needsUpdate = true;

  // 重建分隔釘
  while(pegGroup.children.length) pegGroup.remove(pegGroup.children[0]);
  if(list.length > 1){
    for(let i=0;i<list.length;i++){
      const a = i * segAngle;
      const peg = new THREE.Mesh(pegGeo, gold);
      peg.position.set(Math.cos(a)*R*0.92, Math.sin(a)*R*0.92, 0.33);
      pegGroup.add(peg);
    }
  }
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,Math.min(255,(n>>16)+amt)), g = Math.max(0,Math.min(255,((n>>8)&255)+amt)), b = Math.max(0,Math.min(255,(n&255)+amt));
  return `rgb(${r},${g},${b})`;
}

/* =========================================================
 * 4. 篩選條件過濾邏輯
 * ========================================================= */
const catGrid = document.getElementById("cat-grid");
CATEGORIES.forEach(c => {
  const lbl = document.createElement("label");
  lbl.className = "chk";
  lbl.innerHTML = `<input type="checkbox" value="${c.key}" checked><i class="fa-solid ${c.icon}" style="opacity:.7;width:14px"></i>${c.key}`;
  catGrid.appendChild(lbl);
});

const $ = id => document.getElementById(id);
const spinBtn = $("spin-btn");

function getFilters(){
  return {
    dist: +document.querySelector('input[name="dist"]:checked').value,
    needAC: $("need-ac").checked,
    cats: [...catGrid.querySelectorAll("input:checked")].map(i => i.value),
  };
}
function applyFilters(f){
  return RESTAURANTS.filter(r =>
    r.distanceMeters <= f.dist &&
    (!f.needAC || r.hasAC) &&
    r.categories.some(c => f.cats.includes(c))
  );
}
let currentList = [];
function refresh(){
  const f = getFilters();
  savePrefs(f);
  currentList = applyFilters(f).sort((a,b) => a.distanceMeters - b.distanceMeters);
  $("dist-hint").textContent = DIST_HINT[f.dist];
  $("count-num").textContent = currentList.length;
  $("count-box").classList.toggle("zero", currentList.length === 0);
  spinBtn.disabled = currentList.length === 0;
  $("zero-hint").classList.toggle("show", currentList.length === 0);
  $("match-ul").innerHTML = currentList.map(r =>
    `<li><span>${r.name}</span><span>${r.distanceMeters}m${r.hasAC ? " ❄" : ""}</span></li>`).join("");
  // 打散順序，避免相同距離的餐廳擠在同一側
  buildWheel(shuffle(currentList.slice()));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 還原上次偏好
(function restore(){
  const p = loadPrefs(); if(!p) return;
  const d = document.querySelector(`input[name="dist"][value="${p.dist}"]`); if(d) d.checked = true;
  if(typeof p.needAC === "boolean") $("need-ac").checked = p.needAC;
  if(Array.isArray(p.cats)) catGrid.querySelectorAll("input").forEach(i => i.checked = p.cats.includes(i.value));
})();

document.querySelectorAll('input[name="dist"]').forEach(i => i.addEventListener("change", refresh));
$("need-ac").addEventListener("change", refresh);
catGrid.addEventListener("change", refresh);
$("cat-all").onclick = () => { catGrid.querySelectorAll("input").forEach(i => i.checked = true); refresh(); };
$("cat-none").onclick = () => { catGrid.querySelectorAll("input").forEach(i => i.checked = false); refresh(); };

/* =========================================================
 * 5. 轉動動畫與 Ease-Out 演算法
 * ========================================================= */
const TAU = Math.PI * 2;
const POINTER_ANGLE = Math.PI / 2;     // 指針在正上方
const SPIN_DURATION = 3000;            // 3 秒內停下
let spin = null;                       // {start, from, to, index}
let idleSpeed = 0.0025;
let dragVel = 0, dragging = false;
let lastSector = -1, pointerKick = 0;

const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
const norm = a => ((a % TAU) + TAU) % TAU;

function sectorUnderPointer(rot){
  return Math.floor(norm(POINTER_ANGLE - rot) / segAngle) % Math.max(wheelItems.length,1);
}

function startSpin(){
  if(spin || wheelItems.length === 0) return;
  closeModal();
  const index = Math.floor(Math.random() * wheelItems.length);
  const center = index * segAngle + segAngle / 2;
  const jitter = wheelItems.length > 1 ? (Math.random() - .5) * segAngle * 0.6 : 0;
  const from = spinner.rotation.z;
  const target = POINTER_ANGLE - center - jitter;
  const delta = norm(target - from) + TAU * (5 + Math.floor(Math.random()*2));
  spin = { start: performance.now(), from, to: from + delta, index };
  dragVel = 0;
  document.body.classList.add("spinning");
  spinBtn.disabled = true;
  spinBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>決定中…';
}
spinBtn.addEventListener("click", startSpin);

/* ---------- 3D 彩帶粒子 ---------- */
const confettiGeo = new THREE.PlaneGeometry(0.14, 0.24);
let bursts = [];
function fireConfetti(){
  const origin = new THREE.Vector3(); pointerPivot.getWorldPosition(origin);
  const center = new THREE.Vector3(); wheelRoot.getWorldPosition(center);
  const s = wheelRoot.scale.x;
  const mats = PALETTE.map(c => new THREE.MeshBasicMaterial({ color:c, side:THREE.DoubleSide, transparent:true }));
  const group = new THREE.Group();
  const parts = [];
  for(let i=0;i<320;i++){
    const m = new THREE.Mesh(confettiGeo, mats[i % mats.length]);
    const fromTop = i % 2 === 0;
    const o = fromTop ? origin : center;
    m.position.copy(o); m.position.z += 1;
    const ang = Math.random() * TAU, sp = (fromTop ? 4 : 6) + Math.random() * 6;
    m.scale.setScalar(s);
    parts.push({
      m,
      v: new THREE.Vector3(Math.cos(ang)*sp, Math.sin(ang)*sp*0.8 + 4, Math.random()*4),
      w: new THREE.Vector3(Math.random()*10, Math.random()*10, Math.random()*10),
    });
    group.add(m);
  }
  scene.add(group);
  bursts.push({ group, parts, mats, born: performance.now() });
}
function updateConfetti(dt, now){
  bursts = bursts.filter(b => {
    const age = (now - b.born) / 1000;
    b.parts.forEach(p => {
      p.v.y -= 9 * dt; p.v.multiplyScalar(1 - 1.2*dt);
      p.m.position.addScaledVector(p.v, dt);
      p.m.rotation.x += p.w.x*dt; p.m.rotation.y += p.w.y*dt; p.m.rotation.z += p.w.z*dt;
    });
    const op = Math.max(0, 1 - Math.max(0, age - 1.6) / 1.2);
    b.mats.forEach(m => m.opacity = op);
    if(age > 2.9){ scene.remove(b.group); b.mats.forEach(m => m.dispose()); return false; }
    return true;
  });
}

/* =========================================================
 * 6. UI 事件監聽與結果呈現
 * ========================================================= */
const modal = $("result-modal");
function showResult(r){
  $("r-name").textContent = r.name;
  const mins = Math.max(1, Math.round(r.distanceMeters / 80));
  $("r-dist").textContent = `${r.distanceMeters >= 1000 ? (r.distanceMeters/1000).toFixed(1) + " 公里" : r.distanceMeters + " 公尺"}，步行約 ${mins} 分鐘`;
  const tags = [
    r.hasAC ? '<span class="tag ac"><i class="fa-solid fa-snowflake"></i> 有冷氣</span>'
            : '<span class="tag noac"><i class="fa-solid fa-fan"></i> 無冷氣</span>',
    ...r.categories.map(c => `<span class="tag">${c}</span>`),
    `<span class="tag">${r.priceRange}</span>`,
    `<span class="tag"><i class="fa-solid fa-map-pin"></i> ${zoneOf(r.distanceMeters)}</span>`,
  ];
  $("r-tags").innerHTML = tags.join("");
  $("r-map").href = r.googleMapUrl || mapUrl(r);
  modal.classList.remove("hidden");
  modal.setAttribute("aria-hidden","false");
}
function closeModal(){ modal.classList.add("hidden"); modal.setAttribute("aria-hidden","true"); }

$("r-again").onclick = () => { closeModal(); setTimeout(startSpin, 250); };
$("r-filter").onclick = () => {
  closeModal();
  const ui = $("ui-container"); ui.scrollTo({ top:0, behavior:"smooth" });
  ui.animate([{ boxShadow:"0 0 0 0 rgba(255,193,94,.8)" },{ boxShadow:"0 0 0 14px rgba(255,193,94,0)" }], { duration:700 });
};
modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
  if((e.key === " " || e.key === "Enter") && document.activeElement === document.body && !spinBtn.disabled) startSpin();
});

/* ---------- 互動：視差傾斜 + 拖曳轉動 ---------- */
let tiltTarget = { x:0, y:0 };
let lastPX = 0, lastPY = 0, lastPT = 0;
renderer.domElement.addEventListener("pointermove", e => {
  tiltTarget.x = (e.clientY / innerHeight - .5) * 0.35;
  tiltTarget.y = (e.clientX / innerWidth - .5) * 0.45;
  if(dragging && !spin){
    const now = performance.now();
    const c = wheelScreenCenter();
    const a0 = Math.atan2(-(lastPY - c.y), lastPX - c.x);
    const a1 = Math.atan2(-(e.clientY - c.y), e.clientX - c.x);
    let d = a1 - a0; if(d > Math.PI) d -= TAU; if(d < -Math.PI) d += TAU;
    spinner.rotation.z += d;
    dragVel = d / Math.max(1, now - lastPT) * 16;
    lastPX = e.clientX; lastPY = e.clientY; lastPT = now;
  }
});
renderer.domElement.addEventListener("pointerdown", e => {
  if(spin) return;
  dragging = true; dragVel = 0;
  lastPX = e.clientX; lastPY = e.clientY; lastPT = performance.now();
  renderer.domElement.setPointerCapture(e.pointerId);
});
const endDrag = () => { dragging = false; };
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);
function wheelScreenCenter(){
  const v = new THREE.Vector3(); wheelRoot.getWorldPosition(v); v.project(camera);
  return { x:(v.x+1)/2*innerWidth, y:(1-v.y)/2*innerHeight };
}

/* ---------- 版面：把輪盤放在非側欄的可視區中央 ---------- */
function layout(){
  const W = innerWidth, H = innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z;
  const upp = visH / H; // world units per pixel
  const ui = $("ui-container").getBoundingClientRect();
  const headerH = $("header").getBoundingClientRect().bottom;
  let fx0, fx1, fy0, fy1;
  if(W > 860){ fx0 = ui.right + 10; fx1 = W; fy0 = headerH; fy1 = H; }
  else { fx0 = 0; fx1 = W; fy0 = headerH; fy1 = ui.top - 6; }
  const cx = (fx0 + fx1) / 2, cy = (fy0 + fy1) / 2;
  const size = Math.min(fx1 - fx0, fy1 - fy0) * 0.92;
  const s = Math.min(1.15, (size * upp) / (2 * R + 1.6));
  wheelRoot.scale.setScalar(s);
  wheelRoot.position.set((cx - W/2) * upp, -(cy - H/2) * upp + 0.25 * s, 0);
}
addEventListener("resize", layout);

/* ---------- 主迴圈 ---------- */
let prev = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;

  if(spin){
    const t = Math.min(1, (now - spin.start) / SPIN_DURATION);
    spinner.rotation.z = spin.from + (spin.to - spin.from) * easeOutQuart(t);
    if(t >= 1){
      const winner = wheelItems[spin.index];
      spin = null;
      document.body.classList.remove("spinning");
      spinBtn.disabled = currentList.length === 0;
      spinBtn.innerHTML = '<i class="fa-solid fa-dice"></i>決定吃什麼！';
      fireConfetti();
      setTimeout(() => showResult(winner), 650);
    }
  } else if(!dragging){
    if(Math.abs(dragVel) > 0.0005){ spinner.rotation.z += dragVel; dragVel *= 0.96; }
    else spinner.rotation.z += idleSpeed;   // 微弱待機旋轉
  }

  // 指針過釘回彈
  const sec = sectorUnderPointer(spinner.rotation.z);
  if(sec !== lastSector && wheelItems.length > 1){ pointerKick = 0.35; lastSector = sec; }
  pointerKick *= 0.82;
  pointerPivot.rotation.z = pointerKick;

  // 視差傾斜
  wheelRoot.rotation.x += (tiltTarget.x - wheelRoot.rotation.x) * 0.06;
  wheelRoot.rotation.y += (tiltTarget.y - wheelRoot.rotation.y) * 0.06;

  const stars = scene.getObjectByName("stars"); if(stars) stars.rotation.z += 0.0002;
  updateConfetti(dt, now);
  renderer.render(scene, camera);
}

refresh();
layout();
requestAnimationFrame(animate);
</script>
</body>
</html>
